[project]
name = "applywright"
version = "0.1.0"
description = "A local toolkit for tailored, evidence-backed job applications. It never submits for you."
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "pydantic (>=2.0.0)",
    "mcp (>=1.0.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    {include = "applywright", from = "src"}
]

[tool.poetry.scripts]
applywright = "applywright.server.mcp_app:main"

[dependency-groups]
document-rendering = [
    "jinja2 (>=3.1.6,<4.0.0)",
    "weasyprint (>=69.0,<70.0)",
    "pypdf (>=6.14.2,<7.0.0)",
    "pypdfium2 (>=5.11.0,<6.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "types-pyyaml (>=6.0.12.20261113,<7.0.0.0)"
]

[tool.pytest.ini_options]
pythonpath = "."
# Scope discovery to the two real suites.
testpaths = ["tests", "application_materials/tests"]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
